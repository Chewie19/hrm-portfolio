<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>HRM Portfolio</title>

  <!-- Installable / standalone home-screen app -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d0f12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HRM Portfolio">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0f12; }
    /* black-translucent + viewport-fit=cover puts the page under the status bar
       and home indicator, so inset the frame by the safe areas. */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbzFDZP19exJIwZwKiXw0nl8mZiW9Msf9kAifkt9nHR7ieBbR5o0F5uND_fpD4ojTanF/exec"
    title="HRM Portfolio"
    allowfullscreen>
  </iframe>
</body>
</html>
